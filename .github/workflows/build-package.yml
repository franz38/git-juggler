name: Build Python package

on:
  push:
    tags: ["*"]
  workflow_dispatch:

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the triggering tag is a numeric version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [[ ! "${{ github.ref_name }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${{ github.ref_name }}' is not a numeric version (expected e.g. 1.2.3 or v1.2.3) -- refusing to build/publish."
              exit 1
            fi
          fi

  build:
    needs: validate-tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed by hatch-vcs to derive the version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tooling
        run: python -m pip install --upgrade pip build

      - name: Build frontend and Python distributions
        run: ./scripts/build-package.sh

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: git-juggler-python-package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/git-juggler/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: git-juggler-python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
