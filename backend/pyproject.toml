[project]
name = "git-juggler"
dynamic = ["version"]
description = "Browse multiple local git repos' commit graphs and a shell, from one local web UI."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gitpython>=3.1",
]

[project.scripts]
git-juggler = "git_juggler.main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# pyproject.toml lives in backend/, one level below the actual git root.
root = ".."

[tool.hatch.build.targets.wheel]
packages = ["git_juggler"]
artifacts = ["git_juggler/frontend_dist/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["git_juggler/frontend_dist/**"]
