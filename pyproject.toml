[project]
name = "git-juggler"
dynamic = ["version"]
description = "A local Git dashboard for people juggling agents and too many repos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gitpython>=3.1",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
git-juggler = "git_juggler.main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/git_juggler"]
artifacts = ["src/backend/git_juggler/frontend_dist/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/backend/git_juggler/frontend_dist/**"]
